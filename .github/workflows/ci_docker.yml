# Goal: Build the image for devboard frontend and push to dockerhub
name: CI

on: 
  push:
    branches: ["feat/linter"]


jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        
       # 2. Setup the Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Specify your preferred Node version
          cache: 'npm'       # Automatically caches npm dependencies

      # 3. Install project dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # 4. Run the linter script defined in package.json
      - name: Run ESLint
        run: npm run lint
      
  build-and-push:
    needs: [code-lint]
    runs-on: ubuntu-latest
    steps:
             
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup (Login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-fe-master:latest

    
