# Goal: Build the image for devboard frontend and push to dockerhub
name: CI

on: 
  push:
  branches: [feat/linter]


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setu (Login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCHERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      

    
