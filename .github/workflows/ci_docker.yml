# Goal: Build the image for devboard frontend and push to dockerhub
name: CI

on: 
  push:
    branches: ["feat/linter"]


jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Docker Hub username
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Docker Hub username is missing"
            exit 1
          else
            echo "Docker Hub username is configured"
          fi
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Docker Setup (Login)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}      

    
